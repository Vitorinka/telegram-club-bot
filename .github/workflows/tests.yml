name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codex_ci
          POSTGRES_USER: codex_ci
          POSTGRES_PASSWORD: codex_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_ci -d codex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgresql://codex_ci:codex_ci_password@localhost:5432/codex_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Compile all production Python
        run: |
          git ls-files -z '*.py' ':!:tests/**' |
            xargs -0 env PYTHONPYCACHEPREFIX=/tmp/codex-pycache python3 -m py_compile
      - name: JavaScript syntax
        run: node --check miniapp/app.js
      - name: Dependency consistency
        run: pip check
      - name: Migration tracking policy
        run: |
          if git check-ignore -q migrations/0031_failed_subscription_termination_cycles.sql; then
            echo "Tracked migration files must not be ignored"
            exit 1
          fi
          test -n "$(git ls-files 'migrations/*.sql')"
      - name: Conflict marker scan
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.patch'; then
            echo "Conflict markers found"
            exit 1
          fi
      - name: innerHTML safety scan
        run: |
          if git grep -nE '\.innerHTML[[:space:]]*=' -- 'miniapp/*.js'; then
            echo "Unsafe innerHTML assignment found"
            exit 1
          fi
      - name: PostgreSQL migration integration tests
        run: >
          PYTHONPYCACHEPREFIX=/tmp/codex-pycache python3 -m unittest
          tests.test_postgres_migrations_integration -v
      - name: PostgreSQL migration integration tests repeated
        run: >
          PYTHONPYCACHEPREFIX=/tmp/codex-pycache python3 -m unittest
          tests.test_postgres_migrations_integration -v
      - name: Unit tests
        run: PYTHONPYCACHEPREFIX=/tmp/codex-pycache python3 -m unittest discover -s tests -v
      - name: Secret scan
        run: |
          ! grep -RInE --binary-files=without-match --exclude='*.patch' --exclude='tests.yml' --exclude-dir='.git' '(sk_live_|whsec_|xox[baprs]-|BEGIN RSA PRIVATE KEY|DATABASE_URL=.*:.*@)' .
      - name: pip-audit
        run: pip-audit -r requirements.txt
